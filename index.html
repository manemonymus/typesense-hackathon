<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Visit Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    
    
    <div class="container">
        <button onclick="document.getElementById('myModal').showModal()">New Route</button>
        <dialog class="modal" id="myModal">
            <button onclick="document.getElementById('myModal').close()" class="close-button">✕</button>
            
        <h1>Building Visit Planner</h1>

        <form id="scheduleForm" onsubmit="getSchedule(event)">
            <div class="form-row">
                <label for="s-time">Start time:</label>
                <input type="text" id="s-time" name="s-time">
            </div>

            <div class="form-row">
                <label for="e-time">End time:</label>
                <input type="text" id="e-time" name="e-time">
            </div>

            <div class="form-row">
                <label for="num-buildings">Number of buildings:</label>
                <input type="text" id="num-buildings" name="num-buildings">
            </div>

            <button type="button" class="secondary-button" onclick="enterBuildingNames()">Enter building names</button>

            <div id="enter-building"></div>

            <button type="submit">Create Schedule</button>
        </form>
            
        </dialog>
        <div id="result"></div>
        
    </div>

    <script src="main.js"></script>
</body>
</html>
